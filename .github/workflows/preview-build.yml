name: VaiCar preview build

on:
  push:
    branches:
      - redesign/preview
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check whether the app source has been imported
        id: source
        shell: bash
        run: |
          if [ -f package.json ] && [ -f package-lock.json ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "App source not imported yet; skipping build."
          fi
      - name: Set up Node.js
        if: steps.source.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        if: steps.source.outputs.available == 'true'
        run: npm ci
      - name: Build frontend
        if: steps.source.outputs.available == 'true'
        run: npm run build:web
