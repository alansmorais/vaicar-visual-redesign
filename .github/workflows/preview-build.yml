name: VaiCar preview build

on:
  push:
    branches:
      - redesign/preview
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify source files exist
        shell: bash
        run: |
          test -f package.json
          test -f package-lock.json
          test -f web/src/pages/HomePage.tsx
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build:web
      - name: Upload static build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: vaicar-preview-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
